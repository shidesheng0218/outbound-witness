[package]
name = "outbound-witness-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
outbound-witness-core = { path = "../../crates/core" }
outbound-witness = { path = "../../crates/cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
