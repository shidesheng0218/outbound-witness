[workspace]
members = ["crates/core", "crates/cli", "crates/proxy"]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Outbound Witness contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
